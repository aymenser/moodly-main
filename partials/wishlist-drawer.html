<!-- ==================== WISHLIST DRAWER ==================== -->
<div class="wishlist-drawer" id="wishlistDrawer">
  <div class="drawer-header">
    <h2>Mes favoris</h2>
    <button class="drawer-close" onclick="closeWishlist()">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="wishlist-tagline" id="wishlistTagline">
    "Chérie, arrête de regarder et commande ! Ces pièces t'attendent depuis trop longtemps..."
  </div>
  <div class="drawer-body" id="wishlistItems"></div>
  <div class="drawer-footer">
    <button class="continue-shop-btn" onclick="closeWishlist()">Continuer mes achats</button>
  </div>
</div>
